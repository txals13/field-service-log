<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Service Log</title>
<!-- Fins al 2026-11-23 aquí hi havia la còpia nova de l'app, al costat de la
     que es feia servir. Aquell dia va passar a ser L'APP, a l'arrel. Aquesta
     pàgina només hi porta qui encara tingui l'adreça vella desada o
     instal·lada, i guarda el que hi hagués al final de l'adreça (?perfil=…). -->
<meta http-equiv="refresh" content="1;url=../">
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0F2B5B;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:#fff;font-weight:700}
p{max-width:420px;line-height:1.5}
</style>
</head>
<body>
<p>El Field Service Log ja no és en aquesta adreça.<br><a id="go" href="../">Obre l'aplicació</a></p>
<script>
(function(){
  var to="../"+(location.search||"")+(location.hash||"");
  try{document.getElementById("go").href=to}catch(e){}
  // el worker d'aquesta carpeta ja no ha de servir res: es treu abans de marxar
  var go=function(){try{location.replace(to)}catch(e){location.href=to}};
  try{
    if("serviceWorker" in navigator&&navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){return /\/nou\/$/.test(r.scope)}).map(function(r){return r.unregister()}));
      }).then(go,go);
      setTimeout(go,1500);
    }else go();
  }catch(e){go()}
})();
</script>
</body>
</html>
